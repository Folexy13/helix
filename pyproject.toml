[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "0.1.0"
description = "Helix - Intelligence That Spirals Forward. AI-powered platform with autonomous agents for startups."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Helix Team", email = "team@helix.ai"}
]
keywords = [
    "ai",
    "agents",
    "amazon-nova",
    "bedrock",
    "voice-ai",
    "startup",
    "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.1",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "PyGithub>=2.1.1",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "websockets>=12.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "gitpython>=3.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[project.scripts]
helix = "src.main:app"

[project.urls]
Homepage = "https://github.com/helix-ai/helix"
Documentation = "https://docs.helix.ai"
Repository = "https://github.com/helix-ai/helix"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
